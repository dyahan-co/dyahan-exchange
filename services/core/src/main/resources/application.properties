spring.application.name=core
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/dyahan}
spring.datasource.username=${DB_USERNAME:dyahan}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

outbox.redis.channel=${OUTBOX_REDIS_CHANNEL:dyahan:core:events}
outbox.publisher.fixed-delay-ms=${OUTBOX_PUBLISHER_DELAY_MS:5000}

guess.images.s3.endpoint=${GUESS_IMAGES_S3_ENDPOINT:https://storage.yandexcloud.net}
guess.images.s3.region=${GUESS_IMAGES_S3_REGION:ru-central1}
guess.images.s3.bucket=${GUESS_IMAGES_S3_BUCKET}
guess.images.s3.access-key-id=${GUESS_IMAGES_S3_ACCESS_KEY_ID}
guess.images.s3.secret-access-key=${GUESS_IMAGES_S3_SECRET_ACCESS_KEY}
guess.images.s3.url-duration=${GUESS_IMAGES_S3_URL_DURATION:PT15M}
