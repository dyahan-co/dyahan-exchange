name: Gateway CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  gateway:
    name: Gateway build and unit coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: gateway

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: gateway/package-lock.json

      - run: npm install
      - run: npm run build
      - run: npm run test:cov
